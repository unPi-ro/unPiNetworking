# SwiftLint Configuration File

# Opt-in rules that are useful for networking code
opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument
  - trailing_whitespace
  - todo

# Custom rules configuration
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 40
  error: 100

file_length:
  warning: 500
  error: 1000

# Naming rules
identifier_name:
  min_length: 2
  max_length: 60
  excluded:
    - id
    - URL
    - HTTP
    - API
    - JSON
    - URLSession
    - URLRequest
    - URLResponse
    - URLProtocol
    - XCTest
    - XCTestCase

# Documentation rules
missing_docs:
  warning: true
  excluded:
    - Tests

# Import rules
sorted_imports:
  severity: warning

# Force unwrapping rules
force_unwrapping:
  severity: error

# Force cast rules
force_cast:
  severity: error

# Empty count rules
empty_count:
  severity: warning

# Explicit init rules
explicit_init:
  severity: warning

# Redundant nil coalescing rules
redundant_nil_coalescing:
  severity: warning

# Unneeded parentheses rules
unneeded_parentheses_in_closure_argument:
  severity: warning

# Trailing whitespace rules
trailing_whitespace:
  severity: warning
  ignores_empty_lines: true
  ignores_comments: true

# TODO rules
todo:
  severity: warning

# Exclude certain paths
excluded:
  - Carthage
  - Pods
  - .build
  - Tests 