opt_in_rules:
  - vertical_whitespace
  - trailing_newline
  - empty_count
  - empty_string
  - todo
  - superfluous_disable_command

line_length:
  warning: 150
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true
function_body_length:
  warning: 300
  error: 500
function_parameter_count:
  warning: 6
  error: 8
type_body_length:
  warning: 300
  error: 500
file_length:
  warning: 1000
  error: 1500
  ignore_comment_only_lines: true
nesting:
  type_level: 3
cyclomatic_complexity:
  warning: 50
  error: 55
type_name:
  min_length: 3
  max_length: 70
identifier_name:
  excluded:
    - qa
    - id
  min_length: 3
  max_length: 70
generic_type_name:
  max_length:
    warning: 30
large_tuple:
  warning: 3
  error: 4
reporter: "xcode"
